[package]
name = "agentpay_guard"
version = "0.2.0"
edition = "2021"
publish = false

[dependencies]
odra = { version = "2.8.1", features = [], default-features = false }

[dev-dependencies]
odra-test = { version = "2.8.1", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.8.1", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8.1", features = [], default-features = false }

[features]
default = []

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "agentpay_guard_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "agentpay_guard_build_schema"
path = "bin/build_schema.rs"
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
